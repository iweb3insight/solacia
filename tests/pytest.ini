[pytest]
# Pytest configuration

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    P0: Core functionality tests
    P1: Auxiliary feature tests
    emotion: Emotion detection tests
    diary: Mood diary tests

# Output format
addopts =
    -v
    --tb=short
    --strict-markers
    -rsxX

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
